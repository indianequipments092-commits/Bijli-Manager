name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check URL set hai ya nahi
        run: |
          if grep -q "YOUR-USERNAME" capacitor.config.json; then
            echo "capacitor.config.json me apna GitHub Pages link daalo (server.url)"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm install
      - run: npx cap add android

      - name: Icon aur splash
        run: npx --yes @capacitor/assets generate --android
        continue-on-error: true

      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: bijli-manager-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
